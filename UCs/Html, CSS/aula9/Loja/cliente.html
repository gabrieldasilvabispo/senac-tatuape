<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StyleStore - Àrea do Cliente</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Cabeçalho Principal com navegação -->
     <header>
        <div class="header-container">
            <h1>Style Store</h1>
            <nav>
                <a href="index.html" class="active">Home</a>
                <a href="feminina.html">Feminina</a>
                <a href="masculina.html">Masculina</a>
                <a href="infantil.html">Infantil</a>
                <a href="cliente.html">Àrea do cliente</a>
                <a href="vendedor.html">Àrea do Vendedor</a>

            </nav>
        </div>
     </header>

     <main class="container">
        <!-- Formulario de Autenticação -->
         <div id="box-login" class="card-form">
            <h2>Login do Cliente</h2>
         <form onsubmit="realizarLoginCliente(event)">
            <div class="form-group">
                <label>Email:</label>
                <input type="email" id="cliente-email" required placeholder="seuemail@exemplo.com">
            </div>
         </div>
         <div class="form-group">
            <label>Senha:</label>
            <input type="password" id="cliente-senha" required placeholder="Sua Senha">
         
         </div>
            <button type="submit" class="btn-primary btn-block">Entrar</button> 
         </form>
          </div>
          <!-- Painel de Acompanhamento de Pedidos (Exibidos apos login)-->
           <div id="painel-cliente" class="painel-escondido">
            <div class="topo-painel">
                <h2>Bem-Vindo(a), <span id="nome-usuario-logado">Cliente</span>!</h2>
                <button class="btn-segundario" onclick="realizarLogout()">Sair</button>
               
            </div>

            <h3 class="suntitulo-painel">Meus pedidos Realizados</h3>
            <div class="tabela-container">
                <table>
                    <thead>
                        <tr>
                            <th>N° Pedido</th>
                            <th>Data</th>
                            <th>Item(s)</th>
                            <th>Total</th>
                            <th>Status de Acompanhamento</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-pedidos-cliente"></tbody>
                </table>
            </div>
        </div>
     </main>

     <footer>
            <p>&copy; 2026 StyleStore - Àrea do Cliente</p>
           </footer>

           <!-- Script JavaScript Principal -->
            <script src="js/main.js"></script>
            <script>
                document.addEventListener('DOMContentLoaded', () => {
                  verificarSessaoCliente();
                });
            </script>


</body>
</html>
