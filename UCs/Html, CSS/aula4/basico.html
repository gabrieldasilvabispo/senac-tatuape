<!DOCTYPE html>
<html>
    <head>
        <title>Atividade HTML e CSS</title>
        <meta charset="UTF-8"><!-- META CHARSET "UTF-8 garante que caracteres especiais (cedilha, acentos) seja exibidos corretamente"-->
        <style>
        /*style bloco onde CSS é escrito dentro do HTML*/
        /* Definindo uma classe CSS chamada destaque*/
        .destaque{
            color: #b73011;
            font-family: Arial, Helvetica, sans-serif;
        }            
        </style>
    </head>
    <body>
        <p>Parágrafo sem estilo</p>
        <p class="destaque">Parágrafo com estilo</p>

    </body>
</html>
