<!DOCTYPE html>
<html lang="pt-br">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Exercício 2</title>
</head>
<body>
	<h1>Numeros de 1 a 20</h1>
	<p id="tabuada"></p>

    <script type ="text/javascript">
       
    var i = 1;

    while (i  <= 20 ) {
        document.getElementById('tabuada').innerHTML += i + '<br>';
        i++;
    }

</script>
</body>
</html>
