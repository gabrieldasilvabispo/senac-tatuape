<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Exercício 5</title>
</head>
<body>

    <h1>Números pares de 2 a 50</h1>
    <p id="resultado"></p>

    <script type="text/javascript">

        var i = 2;

        while (i <= 50) {
            document.getElementById('resultado').innerHTML +=
            i + '<br>';

            i = i + 2;
        }

    </script>

</body>
</html>
