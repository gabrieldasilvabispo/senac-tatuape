<!DOCTYPE html>
<html lang="pt-br">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Exercício 3</title>
</head>
<body>
	<h1>Numeros de 1 a 10</h1>
	<p id="tabuada"></p>


    
	<script type ="text/javascript">
	 var i = 10;

    do {
        document.getElementById('tabuada').innerHTML += i + '<br>';
        i--;
    } while (i >= 1);
	
	</script>

</body>
</html>
