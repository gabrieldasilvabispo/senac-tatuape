<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Exercício 1</title>
</head>
<body>

    <h1>Soma de 10 números</h1>
    <p id="resultado"></p>

    <script type="text/javascript">
    var soma = 0;
    for (var i = 1; i <= 10; i++) {
    var numero = parseInt(prompt('Digite o ' + i + 'º número:'));
    soma = soma + numero;
    }
    document.getElementById('resultado').innerHTML =
    'Soma dos números: ' + soma;

    </script>

</body>
</html>
