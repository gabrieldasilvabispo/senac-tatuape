<!DOCTYPE html>
<html lang="pt-br">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Laço de repetição DO</title>
</head>
<body>
	<h1>Laço de repetição DO</h1>
	<p id="tabuada"></p>

<script type= "text/javascript">

    var i = 1;
    while (1 <= 50 ) {
         document.getElementById('tabuada').innerHTML += i + '<br>' ;
           };


</script>
</body>
</html>
