<!DOCTYPE html>
<html lang="pt-br">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Exemplo de vetor</title>
</head>
<body>
	<h1>Exemplo de vetor</h1>
	<p id="teste1">Quantidade de itens do vetor: </p>
	<p id="teste2">Primeiro item do vetor: </p>
	<p id="teste3">Último item do vetor: </p>

	<script>
	// Criando o vetor	
	var cores = ['Verde','Amarelo','Azul','Branco',]; // Criando a variavel cores com quatro elementos
		
	// Exibindo os resultados
	document.getElementById('teste1').innerHTML += cores.length	// Retornar o tamanho do array, ou seja, quantos elementos ele tem.
	document.getElementById('teste2').innerHTML += cores[0]; // Exibe o primeiro elemento do array no indice 0
	document.getElementById('teste3').innerHTML += cores[cores.length -1]; // Acessar o ultimo elemento do array, como cores.length é 4,
																		   // cores[4 -1] = cores[3]	
	</script>

</body>
</html>
