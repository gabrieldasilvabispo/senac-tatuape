<!DOCTYPE html>
<html lang="pt-br">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Laço de repetição FOR</title>
</head>
<body>
	<h1>Laço de repetição FOR</h1>
	<p id="tabuada"></p>

    <script type ="text/javascript">
       
    var i = 1;

    while (i <= 50) {
        document.getElementById('tabuada').innerHTML += i + '<br>';
        i++;
    }

</script>
</body>
</html>
