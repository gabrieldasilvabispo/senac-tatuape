<!DOCTYPE html>
<html lang="pt-br">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Exemplo de vetor</title>
</head>
<body>
	<h1>Exemplo de vetor</h1>
	<h3>Unindo conteúdo de vetores</h3>
	<p id="teste"></p>

	<script>
	// Transformar arrays em listas visuais
	// Criando os vetores
	var vetor1 = [1,2,3];
	var vetor2 = [4,5,6];
	var vetor3 = [7,8,9];
	// Temos três arrays

	var resultado = vetor1.concat(vetor2,vetor3); // Como juntar arrays usando o metodo concat

	document.getElementById('teste').innerHTML = resultado;
	// O metodo concat() não altera o array original, ele cria um novo array juntando os valores

	







	</script>

</body>
</html>
