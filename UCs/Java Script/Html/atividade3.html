<!DOCTYPE html>
<html lang="pt-br">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Laço de repetição FOR</title>
</head>
<body>
	<h1>Laço de repetição FOR</h1>
	<p id="tabuada"></p>


    
	<script type ="text/javascript">
	 var i = 1;

    do {
        document.getElementById('tabuada').innerHTML += i + '<br>';
        i++;
    } while (i <= 50);
	
	</script>

</body>
</html>
