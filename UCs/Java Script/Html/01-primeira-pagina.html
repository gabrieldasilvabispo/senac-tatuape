<!DOCTYPE html>
<html lang="pt-br">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Primeira página em JavaScript</title>
</head>
<body>
	<h1>Primeira página em JavaScript</h1>
	<p id="texto"></p>
	<script>
		//Comentario na linha
		/* isto é um comentario
		que contém varias linhas
		de informações
		*/
		document.write ('Meu primeiro tezto em javaScript');
		document.getElementById('texto').innerHTML='Segundo texto em JavaScript';
		/*
		O objetivo desee metodo é obter um elemento que tenha um id
		com o nome texto e atribuir a esse elemento a frase que esta
		logo apos a propriedade innerhtml
		*/
	</script>
</body>
</html>
