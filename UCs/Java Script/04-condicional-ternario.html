<!DOCTYPE html>
<html lang="pt-br">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Estrutura condicional ternario</title>
</head>
<body>
	<h1>Estrutura condicional ternario</h1>
	<p id="teste"></p>

	<script>
		//Criando a variaveis
		var media =7;
		var resultado ='';// expressão boolena = vazia

		// Condicional ternário
		resultado = (media>=7)? 'Aprovado(a)':'Reprovado(a)';

		//Mostrar o resultado
		document.getElementById('teste').innerHTML=resultado;	
	</script>

</body>
</html>
