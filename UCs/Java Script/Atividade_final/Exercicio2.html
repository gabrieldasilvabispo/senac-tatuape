<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Exercício 2</title>
</head>
<body>

    <h1>Cálculo da Média</h1>

    <p id="resultado"></p>

    <button onclick="calcularMedia(8, 6)">Calcular Média</button>

    <script>
    function calcularMedia(nota1, nota2) {
    var media = (nota1 + nota2) / 2;
    document.getElementById("resultado").innerHTML =  "Média: " + media;
        }
    </script>

</body>
</html>
